name: Cipher-B-Scan

on:
  schedule:
    - cron: "30 5 * * 6"     # Samstag 05:30 UTC: Weekly-Scan (Wochenkerze von Fr. ist bestätigt)
    - cron: "45 5 * * 2-6"   # Di–Sa 05:45 UTC: Daily-Check nach US-Schluss
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly | daily | validate | universe | dashboard"
        default: weekly
      tickers:
        description: "nur für validate, z.B. CLSK AAPL"
        default: CLSK

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Modus bestimmen
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 5 * * 6" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Universum aktualisieren
        if: steps.m.outputs.mode == 'weekly' || steps.m.outputs.mode == 'universe'
        run: mkdir -p results && python scanner/build_universe.py 2>&1 | tee results/universe_log.txt

      - name: Weekly-Scan
        if: steps.m.outputs.mode == 'weekly'
        run: python scanner/scan.py weekly

      - name: Daily-Check
        if: steps.m.outputs.mode == 'daily'
        run: python scanner/scan.py daily

      - name: Dashboard-Daten bündeln
        if: steps.m.outputs.mode == 'weekly' || steps.m.outputs.mode == 'daily' || steps.m.outputs.mode == 'dashboard'
        run: python scanner/make_dashboard.py

      - name: Abgleich mit TradingView
        if: steps.m.outputs.mode == 'validate'
        run: mkdir -p results && python scanner/scan.py validate ${{ inputs.tickers }} 2>&1 | tee results/validate.txt

      - name: Ergebnisse speichern
        if: always()
        run: |
          git config user.name "cipher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A universe results
          git diff --cached --quiet || git commit -m "Scan ${{ steps.m.outputs.mode }} $(date -u +%F)"
          git pull --rebase && git push

  pages:
    needs: scan
    if: always() && needs.scan.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          { printf '<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>'; cat dashboard/index.html; printf '</body></html>'; } > _site/index.html
          cp results/dashboard.json _site/dashboard.json 2>/dev/null || echo "{}" > _site/dashboard.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

name: Cipher-B-Scan

on:
  schedule:
    - cron: "30 5 * * 6"     # Samstag 05:30 UTC: Weekly-Scan (Wochenkerze von Fr. ist bestätigt)
    - cron: "45 5 * * 2-6"   # Di–Sa 05:45 UTC: Daily-Check nach US-Schluss
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly | daily | validate | universe"
        default: weekly
      tickers:
        description: "nur für validate, z.B. CLSK AAPL"
        default: CLSK

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Modus bestimmen
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 5 * * 6" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Universum aktualisieren
        if: steps.m.outputs.mode == 'weekly' || steps.m.outputs.mode == 'universe'
        run: mkdir -p results && python scanner/build_universe.py 2>&1 | tee results/universe_log.txt

      - name: Weekly-Scan
        if: steps.m.outputs.mode == 'weekly'
        run: python scanner/scan.py weekly

      - name: Daily-Check
        if: steps.m.outputs.mode == 'daily'
        run: python scanner/scan.py daily

      - name: Abgleich mit TradingView
        if: steps.m.outputs.mode == 'validate'
        run: mkdir -p results && python scanner/scan.py validate ${{ inputs.tickers }} 2>&1 | tee results/validate.txt

      - name: Ergebnisse speichern
        if: always()
        run: |
          git config user.name "cipher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A universe results
          git diff --cached --quiet || git commit -m "Scan ${{ steps.m.outputs.mode }} $(date -u +%F)"
          git pull --rebase && git push
